[theme.light]
primaryColor = "#0f766e"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#0f172a"

[theme.dark]
primaryColor = "#2dd4bf"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"

[theme]
baseRadius = "0.6rem"

[client]
toolbarMode = "minimal"

[server]
# session conservée 6 h après une coupure (téléphone en veille) : au retour, reprise sans recharger
disconnectedSessionTTL = 21600

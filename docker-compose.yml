services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: validation
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d validation"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
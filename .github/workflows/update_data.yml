name: update-data

on:
  schedule:
    - cron: "0 21 1 * *"      # 1st of each month, 21:00 UTC = 22:00 in Tunisia (winter time)
  workflow_dispatch:           # lets you start it by hand to test

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests xlrd openpyxl pandas truststore
      - run: python cached_data/update_dpm.py
      - run: python cached_data/update_bdpm.py
      - run: python cached_data/update_dci_inn.py
      - run: python cached_data/update_atc.py
      - run: python cached_data/update_dci_atc.py
      - run: python cached_data/update_thesaurus.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add cached_data/cached_data.db
          git commit -m "Update cached data" || echo "No changes"
          git push